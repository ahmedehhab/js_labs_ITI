<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <script>
    window.addEventListener("keydown", function(event) {
    alert("Key pressed: " + event.key);
    alert("Physical code: " + event.code);
    alert("Alt key pressed" + event.altKey);
    alert("Control key pressed" + event.ctrlKey);
    alert("ASCII CODE" + event.key.charCodeAt(0));
    
});
       </script>
</body>
</html>
