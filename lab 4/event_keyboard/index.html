<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <script>
    window.addEventListener("keydown", function(event) {
        if(event.shiftKey)
        {
            alert("Shift key pressed " + event.shiftKey);
        }else if(event.ctrlKey)
        {
            alert("Ctrl key pressed " + event.ctrlKey);
        }else  alert("ASCII CODE " + event.key.charCodeAt(0));
    
    
});
       </script>
</body>
</html>
